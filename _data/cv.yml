      - name: National Science Foundation Graduate Research Fellow
        date: 2023 awardee
        highlights:
          - Conducted CO₂ hydrate formation experiments using gas mixtures of CO₂ and N₂ to evaluate magnesium kinetic promoter and to study the impact of lower concentrated CO₂ streams on hydrate formation rates in a bubble column reactor.
          - Modeling techno-economics of a hydrates-based desalination facility from mixed gas sources to understand the economic implications and to compare against pure CO₂ sequestration costs and leading desalination techniques.
          - Developing a life cycle analysis study for CO₂ separation and sequestration via hydrates for storage on the seabed floor.
          - Designed and fabricated thermal testbeds and developed CFD simulations (ANSYS) to quantify heat transfer enhancements in heat pipes and interposers for next-generation integrated electronic packages as part of two Texas Institute of Electronics (TIE) projects.
          - Collaborating with researchers from Instituto Superior Técnico, University of Lisbon to develop novel magnesium based ionic liquids for CCUS and gas separation applications.
          - Developing first principles, system-level, and techno-economic models of a novel mass exchanger for use in direct air capture installations.
          - Studied the economic and emissions impact of electrified hydrogen production on the final costs of ethanol in the Midwest utilizing Aspen Plus, H2A-Lite, and GREET models.
          
      - name: Graduate Research Assistant
        date: Mar. 2022 – Sept. 2023
        highlights:
          - Designed and executed THF hydrate formation studies to further understand the mechanisms of magnesium-based nucleation promotion.
          - Developed a process model in Aspen Plus and a techno-economic model in MATLAB to analyze the economic and emissions benefits of clean hydrogen-based ammonia production.
          - ARPA-E sponsored project to develop novel insulating materials to extend the life of power transformers. Experimental data was used to refine and verify ANSYS thermal model of the transformer. Characterized thermal degradation threshold for insulating materials via viscosity and tensile strength measurements.
          
      - name: Systems Optimization & Multi-Scale Analysis Lab, Texas A&M University
        date: Summer 2016
        summary: Undergraduate Research Assistant
        highlights:
          - Investigated water extraction and purification technologies from effluent streams to develop a process superstructure and MINLP model.

