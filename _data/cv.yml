      - company: Bahadur Research Group, The University of Texas at Austin
        position: NSF Graduate Research Fellow
        location: Austin, TX
        start_date: 2023-09
        end_date: 2026-08
        highlights:
          - Conducted CO₂ hydrate formation experiments with CO₂/N₂ gas mixtures in a bubble column reactor to evaluate a magnesium kinetic promoter and the effect of lower-concentration CO₂ streams on formation rates.
          - Modeled the techno-economics of hydrate-based desalination from mixed gas sources, benchmarked against pure CO₂ sequestration and leading desalination technologies.
          - Developed a life cycle analysis of CO₂ separation and seabed sequestration via hydrates.
          - Designed thermal testbeds and ANSYS CFD models to quantify heat transfer enhancement in heat pipes and interposers for next-generation electronic packages (two Texas Institute for Electronics projects).
          - Collaborated with Instituto Superior Técnico, University of Lisbon, on magnesium-based ionic liquids for CCUS and gas separation.
          - Developed first-principles, system-level, and techno-economic models of a novel mass exchanger for direct air capture.
          - Assessed the cost and emissions impact of electrolytic hydrogen on Midwest ethanol using Aspen Plus, H2A-Lite, and GREET.

