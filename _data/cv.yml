          - Built an Aspen Plus process model and MATLAB techno-economic model of clean hydrogen-based ammonia production.
          - "ARPA-E project: developed insulating materials to extend power transformer life; used experimental data to refine an ANSYS thermal model and characterized thermal degradation via viscosity and tensile strength."

